# One sniffarr process: the API with the database, the web UI, the DHT
# sniffer and the metadata fetcher. The host network carries the DHT port
# and the UPnP discovery; the UI then listens on the host's :8081 and
# authenticates nobody.
#
#   mkdir -p data && sudo chown 65532:65532 data
#   SNIFFARR_VERSION=0.38.0 docker compose up -d
services:
  sniffarr:
    image: sarak.sh/arr/sniffarr:${SNIFFARR_VERSION:?a release, such as 0.38.0}
    command: ["-api", "-ui", "-sniff", "-fetch", "-upnp"]
    network_mode: host
    environment:
      SNIFFARR_DB: /data/sniffarr.db
    # Keys and the rest of the settings: TYPESAFE_API_KEY, SNIFFARR_UI_ADDR,
    # SNIFFARR_TORZNAB_TOKEN, SNIFFARR_WEBHOOK_TOKEN, SNIFFARR_AUDIO_LANGUAGES.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
    restart: unless-stopped
