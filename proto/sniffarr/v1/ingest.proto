syntax = "proto3";

package sniffarr.v1;

import "sniffarr/v1/track.proto";

option go_package = "github.com/mikluko/sniffarr/internal/apis/sniffarr/v1;sniffarrv1";

// IngestService is the work queue between sniffers: discoverers report the
// infohashes they sight, fetchers take them as tasks and return metadata,
// and both report the peers they see as sketches.
service IngestService {
  // Sight queues every infohash the server has neither stored, rejected nor
  // queued, and reports the totals, and which infohashes are stored torrents,
  // when the client closes the stream. A sighting of a stored torrent moves
  // its last sighting; an announce sighting moves a queued sample ahead.
  rpc Sight(stream SightRequest) returns (SightResponse);
  // Fetch leases one queued infohash per unit of credit to the stream, and
  // takes the results back on it. A lease returns to the queue when the
  // stream ends without its result or when the lease expires.
  rpc Fetch(stream FetchRequest) returns (stream FetchResponse);
  // HashKey returns the key every client hashes peers with before adding
  // them to a sketch, and the ID of the sniffing DHT node. The server
  // generates both once and keeps them for the life of its store, so
  // sketches from any client and any time merge and the node keeps its ID
  // across restarts.
  rpc HashKey(HashKeyRequest) returns (HashKeyResponse);
  // Peers merges each sketch of the stream into the stored sketch of its
  // torrent and hour, and reports the totals when the client closes the
  // stream. A sketch of an infohash that is not stored is dropped.
  rpc Peers(stream PeersRequest) returns (PeersResponse);
  // ProbeTask leases the next stored release whose main video file is to be
  // probed for its tracks, or none while there is none or the day's
  // download budget is spent.
  rpc ProbeTask(ProbeTaskRequest) returns (ProbeTaskResponse);
  // ProbeResult records the outcome of a probe and the piece data it
  // downloaded.
  rpc ProbeResult(ProbeResultRequest) returns (ProbeResultResponse);
}

message SightRequest {
  // The BitTorrent v1 infohash, 20 bytes.
  bytes infohash = 1;
  Source source = 2;
}

message SightResponse {
  // Infohashes queued by the stream.
  int64 new = 1;
  // Infohashes already stored, rejected or queued.
  int64 known = 2;
  // One entry per request of the stream, in order: whether its infohash was
  // a stored torrent when the server handled it. Rejected and queued
  // infohashes are false.
  repeated bool stored = 3;
}

// Source is how a sniffer learned of an infohash.
enum Source {
  SOURCE_UNSPECIFIED = 0;
  // A BEP 51 sample_infohashes reply.
  SOURCE_SAMPLE = 1;
  // An announce_peer query received by the sniffer's DHT node.
  SOURCE_ANNOUNCE = 2;
  // A grab or import Radarr or Sonarr reported; the queue serves these
  // first.
  SOURCE_ARR = 3;
}

message FetchRequest {
  oneof kind {
    Credit credit = 1;
    Result result = 2;
  }
}

// Credit is room for n more tasks.
message Credit {
  int32 n = 1;
}

// Result is the outcome of one task.
message Result {
  bytes infohash = 1;
  oneof outcome {
    Torrent torrent = 2;
    Failure failure = 3;
  }
}

// Torrent is the metadata of one torrent, as its peers gave it.
message Torrent {
  string name = 1;
  // Total size of all files in bytes.
  int64 size = 2;
  repeated File files = 3;
}

message File {
  // Path inside the torrent, components joined by "/".
  string path = 1;
  int64 size = 2;
}

// Failure is why a task produced no metadata.
enum Failure {
  FAILURE_UNSPECIFIED = 0;
  // No peers were found on the DHT.
  FAILURE_NO_PEERS = 1;
  // Peers were found but did not give up the metadata in time.
  FAILURE_TIMEOUT = 2;
}

message FetchResponse {
  Task task = 1;
}

// Task asks for the metadata of one infohash.
message Task {
  bytes infohash = 1;
}

message HashKeyRequest {}

message HashKeyResponse {
  // The SipHash-2-4 key, 16 bytes: k0 is the first 8 in little-endian order,
  // k1 the last 8.
  bytes key = 1;
  // The DHT node ID of the sniffer that discovers, 20 random bytes.
  bytes node_id = 2;
}

// PeersRequest is a sketch of the peers of one torrent seen in one hour.
message PeersRequest {
  bytes infohash = 1;
  // Start of the UTC hour the peers were seen in, in seconds since the Unix
  // epoch; a time within the hour is rounded down to it.
  int64 hour = 2;
  // A HyperLogLog sketch in the Aggregate Knowledge storage specification
  // v1.0.0 with log2m 10 and regwidth 5, of peers hashed with the HashKey
  // key: SipHash-2-4 of the IP, 4 bytes for IPv4 and 16 for IPv6, followed
  // by the port in big-endian order.
  bytes sketch = 3;
}

message PeersResponse {
  // Sketches merged into a stored torrent's.
  int64 merged = 1;
  // Sketches of infohashes not stored.
  int64 dropped = 2;
}

message ProbeTaskRequest {}

message ProbeTaskResponse {
  // Absent when there is nothing to probe.
  ProbeTask task = 1;
}

// ProbeTask asks for the tracks of one release's main video file.
message ProbeTask {
  bytes infohash = 1;
  // The most piece data, in bytes, the probe may download.
  int64 max_bytes = 2;
}

message ProbeResultRequest {
  bytes infohash = 1;
  // Piece data downloaded for the probe, in bytes.
  int64 downloaded = 2;
  oneof outcome {
    ProbedFile file = 3;
    ProbeFailure failure = 4;
  }
}

// ProbedFile is what a probe read of the file it chose.
message ProbedFile {
  // Path inside the torrent, components joined by "/".
  string path = 1;
  // "matroska" or "mp4".
  string format = 2;
  repeated Track tracks = 3;
}

// ProbeFailure is why a probe returned no tracks.
enum ProbeFailure {
  PROBE_FAILURE_UNSPECIFIED = 0;
  // No peers were found on the DHT.
  PROBE_FAILURE_NO_PEERS = 1;
  // The metadata or the pieces did not arrive in time.
  PROBE_FAILURE_TIMEOUT = 2;
  // The torrent has no Matroska or MP4 file, the file's format is not one,
  // its track list lies beyond max_bytes of piece data, or its header is
  // malformed. A probe that ends so is not repeated.
  PROBE_FAILURE_UNKNOWN = 3;
}

message ProbeResultResponse {}
