syntax = "proto3";

package sniffarr.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mikluko/sniffarr/internal/apis/sniffarr/v1;sniffarrv1";

// SearchService looks up stored torrents.
service SearchService {
  // Search returns releases whose name or stored file paths contain every
  // word of the query, best match first; an empty query returns the most
  // recently seen. Releases classified as adult or software are never
  // returned. Before answering, it has the classifier examine a bounded
  // number of the candidates it has not examined yet, for as long as a
  // short deadline allows; a slow or failing classifier leaves them as they
  // were.
  rpc Search(SearchRequest) returns (SearchResponse);
  // Get returns one release, or NOT_FOUND.
  rpc Get(GetRequest) returns (GetResponse);
}

message SearchRequest {
  string query = 1;
  // Only releases of these kinds; KIND_UNSPECIFIED selects unclassified
  // ones. Empty means any kind.
  repeated Kind kinds = 2;
  reserved 3;
  reserved "min_russian_audio";
  // At most this many releases: 50 when unset, never more than 500.
  int32 limit = 4;
  // The language, a BCP-47 tag, that min_audio_probability applies to;
  // required with it.
  optional string audio_language = 5;
  // Only releases whose probability of an audio track in audio_language is
  // known and at least this.
  optional float min_audio_probability = 6;
  // Only releases of the work with this ID; query may be empty then.
  optional ExternalId id = 7;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 8;
}

message SearchResponse {
  repeated Release releases = 1;
}

message GetRequest {
  bytes infohash = 1;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 2;
}

message GetResponse {
  Release release = 1;
}

// Release is a stored torrent with its classification.
message Release {
  bytes infohash = 1;
  string name = 2;
  int64 size = 3;
  int64 file_count = 4;
  // KIND_UNSPECIFIED until the torrent is classified.
  Kind kind = 5;
  reserved 6;
  reserved "russian_audio";
  VideoSource source = 7;
  // The classifier's confidence in kind and source, 0 when unclassified.
  float kind_confidence = 8;
  float source_confidence = 9;
  google.protobuf.Timestamp first_seen = 10;
  google.protobuf.Timestamp last_seen = 11;
  string magnet = 12;
  // What decided kind; LAYER_UNSPECIFIED while kind is unknown.
  Layer layer = 13;
  // Whether the classifier has examined the release; source, and audio
  // probabilities a marker did not decide, come from it.
  bool classified = 14;
  // At most one entry per audio language the server is configured with, in
  // tag order; empty without audio languages.
  repeated Audio audio = 15;
  // IDs of the work the release's title is matched to, in provider order;
  // empty while unmatched or without title matching.
  repeated ExternalId ids = 16;
  // What matched the title; TMDB_LAYER_UNSPECIFIED while unmatched.
  TMDBLayer tmdb_layer = 17;
  // Confidence in the title match, 0 while unmatched.
  float tmdb_confidence = 18;
  // Distinct peers of the release over the last 7 days, as last computed by
  // the server; what SORT_PEERS orders by.
  int64 peers_week = 19;
  // What TMDB knows of the work the release's title is matched to; absent
  // while the title was never looked up or without title matching.
  TMDBWork tmdb = 20;
}

// ExternalId is a work's ID with one provider: "tmdb", "imdb", "tvdb" or
// "wikidata".
message ExternalId {
  string provider = 1;
  string id = 2;
}

// TMDBWork is the outcome of looking a title up on TMDB: the work it matched,
// with what TMDB tells of it, or, with id 0, that nothing matched. Texts are
// in the language the request asked for, falling back to the other stored
// language, and the title to original_title last.
message TMDBWork {
  // TMDB's ID of the work; 0 when the title matched nothing.
  int64 id = 1;
  // "movie" or "tv".
  string type = 2;
  // IMDb's ID, "tt" first; empty when TMDB has none.
  string imdb_id = 3;
  string title = 4;
  string original_title = 5;
  // The year of release or first air, 0 when unknown.
  int32 year = 6;
  // TMDB's poster path, to append to its image base URL and a size; empty
  // without a poster.
  string poster_path = 7;
  string overview = 8;
  repeated string genres = 9;
  // TMDB's average vote, 0 to 10, and how many votes.
  double rating = 10;
  int32 votes = 11;
  // Minutes: a movie's runtime, a typical episode's for a series; 0 when
  // unknown.
  int32 runtime = 12;
  // A series' status as TMDB names it, such as "Returning Series" or
  // "Ended", and its seasons; empty and 0 for a movie.
  string status = 13;
  int32 seasons = 14;
  // ISO 3166-1 alpha-2 codes of the origin countries.
  repeated string countries = 15;
  // ISO 639-1 code of the original language.
  string language = 16;
  // What matched the title; TMDB_LAYER_UNSPECIFIED when nothing matched.
  TMDBLayer layer = 17;
  // Confidence in the match, 0 when nothing matched.
  float confidence = 18;
  // When the title was looked up.
  google.protobuf.Timestamp checked_at = 19;
}

// TMDBLayer is what matched a release's title to a work.
enum TMDBLayer {
  TMDB_LAYER_UNSPECIFIED = 0;
  // TMDB's search, with one plausible candidate.
  TMDB_LAYER_SEARCH = 1;
  // The classifier, choosing among several.
  TMDB_LAYER_CLASSIFIER = 2;
}

// Audio is what is known of a release's audio track in one language.
message Audio {
  // BCP-47 tag.
  string language = 1;
  // Probability of an audio track in the language: 1 when marker is set,
  // else the classifier's answer; absent while unknown.
  optional float probability = 2;
  // A word or studio of the language is in the release's name or paths.
  bool marker = 3;
  // Letters of the language's script are in the release's name or paths.
  bool script_hint = 4;
}

// Layer is what decided a release's kind.
enum Layer {
  LAYER_UNSPECIFIED = 0;
  // Rules reading the release's name.
  LAYER_RULES = 1;
  // A release of the same title whose kind was decided.
  LAYER_REUSE = 2;
  // The classifier.
  LAYER_CLASSIFIER = 3;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_MOVIE = 1;
  KIND_SERIES = 2;
  KIND_MUSIC = 3;
  KIND_BOOK = 4;
  KIND_SOFTWARE = 5;
  KIND_ADULT = 6;
  KIND_OTHER = 7;
}

// VideoSource is the kind of copy a video release is.
enum VideoSource {
  VIDEO_SOURCE_UNSPECIFIED = 0;
  VIDEO_SOURCE_DISC_IMAGE = 1;
  VIDEO_SOURCE_REMUX = 2;
  VIDEO_SOURCE_ENCODE = 3;
  VIDEO_SOURCE_WEB = 4;
  VIDEO_SOURCE_OTHER = 5;
}
