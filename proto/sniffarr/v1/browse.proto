syntax = "proto3";

package sniffarr.v1;

import "google/protobuf/timestamp.proto";
import "sniffarr/v1/ingest.proto";
import "sniffarr/v1/search.proto";

option go_package = "github.com/mikluko/sniffarr/internal/apis/sniffarr/v1;sniffarrv1";

// BrowseService reads the store as the web UI shows it: movies and series
// by TMDB, from the store and from TMDB's search, each with its releases;
// the releases under their filters; a release with its stored files;
// counts; and the movies and series most peers share. Unlike
// SearchService it classifies nothing before answering.
//
// A work is a movie or series on TMDB. A release belongs to the work its
// title key is matched to; several title keys, such as a title in Russian
// and in English, can be matched to one work. Peers are counted per torrent
// and hour in HyperLogLog sketches, so every count is an estimate within a
// few percent, and a work's peers are the distinct peers of all its
// releases over the window.
service BrowseService {
  // SearchTitles returns the works whose titles, or whose releases' names
  // and file paths, contain every word of the query, and the works TMDB's
  // search finds for it, which it stores: first those with releases, most
  // peers over the last 7 days first, then the rest, most popular on TMDB
  // first. A failing TMDB leaves the answer to the store.
  rpc SearchTitles(SearchTitlesRequest) returns (SearchTitlesResponse);
  // Title returns one work with its places in the tops, peers and audio, or
  // NOT_FOUND.
  rpc Title(TitleRequest) returns (TitleResponse);
  // TitleReleases returns one page of the releases of a work the filters
  // select, or NOT_FOUND.
  rpc TitleReleases(TitleReleasesRequest) returns (TitleReleasesResponse);
  // Torrents returns one page of the releases the filters select, matched
  // to a work or not, in the order sort asks for, and how many they select
  // in all. Adult releases are left out.
  rpc Torrents(TorrentsRequest) returns (TorrentsResponse);
  // Card returns one release with every stored file, its peers and its
  // work, or NOT_FOUND.
  rpc Card(CardRequest) returns (CardResponse);
  // Stats returns the store's counts.
  rpc Stats(StatsRequest) returns (StatsResponse);
  // Home returns the counts the home page shows.
  rpc Home(HomeRequest) returns (HomeResponse);
  // Top returns one page of the 100 movies or series with the most peers
  // over a window, as last computed; the server recomputes every 10
  // minutes.
  rpc Top(TopRequest) returns (TopResponse);
  // Settings returns what the server is configured with that a client
  // showing its answers needs to know.
  rpc Settings(SettingsRequest) returns (SettingsResponse);
}

message SettingsRequest {}

message SettingsResponse {
  // The audio languages the server is configured with, BCP-47 tags in the
  // server's order; empty when the audio extension is off.
  repeated string audio_languages = 1;
}

// WorkSummary is a work as lists show it.
message WorkSummary {
  // The work's ID: "m" and the TMDB ID for a movie, "tv" and the TMDB ID
  // for a series, as movies and series are numbered apart on TMDB.
  string id = 1;
  // KIND_MOVIE or KIND_SERIES.
  Kind kind = 2;
  // What TMDB tells of the work, with its texts in the request's lang;
  // layer, confidence and checked_at are a release's match and set on a
  // card only.
  TMDBWork tmdb = 3;
  // Stored releases of the work; 0 for a work known from TMDB's search
  // only.
  int64 releases = 4;
  // Distinct peers of the work's releases over the last 7 days, as last
  // computed.
  int64 peers = 5;
  // The work's place in the last 7 days' top of its kind among all voices,
  // 1 first; 0 when it is not in it.
  int32 rank = 6;
}

// WorkAudio sums up the audio in one language of a work's releases.
message WorkAudio {
  // BCP-47 tag.
  string language = 1;
  // Releases with a marker of the language, and their marks, each once,
  // most frequent first.
  int64 marked = 2;
  repeated string marks = 3;
  // Releases without a marker whose probability of an audio track in the
  // language is at least 0.5.
  int64 likely = 4;
}

message SearchTitlesRequest {
  // Words the titles, or the release names and paths, must all contain.
  string query = 1;
  // KIND_MOVIE or KIND_SERIES; KIND_UNSPECIFIED is both.
  Kind kind = 2;
  // The language of TMDBWork texts and of TMDB's search, "ru" or "en";
  // "en" when empty.
  string lang = 3;
}

message SearchTitlesResponse {
  // The works with releases, then those without.
  repeated WorkSummary works = 1;
  // How many of works have releases, and how many have none.
  int32 ours = 2;
  int32 tmdb_only = 3;
}

message TitleRequest {
  // WorkSummary.id.
  string id = 1;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 2;
}

message TitleResponse {
  WorkSummary work = 1;
  // The work's places in the top of its kind among all voices, 0 where it
  // is not in it.
  WindowRanks ranks = 2;
  // Distinct peers of all the work's releases over each window.
  PeerCounts peers = 3;
  // One entry per audio language the server is configured with, in its
  // order.
  repeated WorkAudio audio = 4;
}

// WindowRanks are places in the tops over each window.
message WindowRanks {
  int32 day = 1;
  int32 week = 2;
  int32 month = 3;
}

message TitleReleasesRequest {
  // WorkSummary.id.
  string id = 1;
  // Only releases of this quality; QUALITY_UNSPECIFIED is any.
  Quality quality = 2;
  // Only releases of this source; VIDEO_SOURCE_UNSPECIFIED is any.
  VideoSource source = 3;
  // Only releases of at least and at most this many bytes; 0 is no bound.
  int64 min_size = 4;
  int64 max_size = 5;
  // The language, a BCP-47 tag, voice applies to; required with a voice.
  optional string audio_language = 6;
  Voice voice = 7;
  // Only releases of this season and this episode; 0 is any. A whole
  // season has no episode.
  int32 season = 8;
  int32 episode = 9;
  // SORT_PEERS, SORT_FIRST_SEEN or SORT_SIZE; SORT_UNSPECIFIED is
  // SORT_PEERS.
  Sort sort = 10;
  // Releases to skip.
  int32 offset = 11;
  // At most this many releases: 50 when unset, never more than 500.
  int32 limit = 12;
}

message TitleReleasesResponse {
  // The releases selected, each with its audio, without tmdb.
  repeated Release releases = 1;
  // The work's releases, and those the filters select.
  int64 total = 2;
  int64 matched = 3;
  // The seasons among the work's releases, in order.
  repeated int32 seasons = 4;
}

message TorrentsRequest {
  // Words that the name or stored file paths must all contain, or the 40
  // hex digits of an infohash.
  string query = 1;
  // Only releases of this kind; KIND_OTHER takes music, books and software
  // in. KIND_UNSPECIFIED is any.
  Kind kind = 2;
  // Only releases whose kind is unknown; kind must be KIND_UNSPECIFIED.
  bool unknown_kind = 3;
  // Only releases matched to a work, or only those matched to none.
  optional bool matched = 4;
  // Only releases of this quality; QUALITY_UNSPECIFIED is any.
  Quality quality = 5;
  // The language, a BCP-47 tag, voice applies to; required with a voice.
  optional string audio_language = 6;
  Voice voice = 7;
  // Only releases of this source; VIDEO_SOURCE_UNSPECIFIED is any.
  VideoSource source = 8;
  // Only releases whose kind this layer decided; LAYER_UNSPECIFIED is any.
  Layer layer = 9;
  // Only releases of at least this many bytes.
  int64 min_size = 10;
  Sort sort = 11;
  // Releases to skip.
  int32 offset = 12;
  // At most this many releases: 50 when unset, never more than 500.
  int32 limit = 13;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 14;
}

message TorrentsResponse {
  repeated TorrentRow rows = 1;
  // How many releases the filters select in all.
  int64 total = 2;
}

// TorrentRow is a release with its work.
message TorrentRow {
  Release release = 1;
  // Absent while the release's title key is matched to no work.
  WorkSummary work = 2;
}

// Sort is the order of releases.
enum Sort {
  // Best text match first with a query, most recently seen first without;
  // most peers first for a work's releases.
  SORT_UNSPECIFIED = 0;
  // Most peers over the last 7 days first, as last computed.
  SORT_PEERS = 1;
  SORT_LAST_SEEN = 2;
  // Largest first.
  SORT_SIZE = 3;
  // Most recently first seen first.
  SORT_FIRST_SEEN = 4;
}

message CardRequest {
  bytes infohash = 1;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 2;
}

message CardResponse {
  // The release; its tmdb is the state of its title key's match.
  Release release = 1;
  // How the release's infohash was first learned of.
  Source discovery = 2;
  // The stored files, the largest of the release's, in stored order.
  repeated File files = 3;
  // Distinct peers of the release over the last day, 7 days and 30 days.
  PeerCounts peers = 4;
  reserved 5, 6, 7;
  reserved "releases", "release_rank";
  // The release's work, with tmdb carrying the match's layer, confidence
  // and checked_at; absent while its title key is matched to none.
  WorkSummary work = 8;
  // The release's place among its work's releases by peers over the last
  // 7 days, 1 first; 0 without a work.
  int32 rank_in_work = 9;
  // The rules that recognised features in the release's name or file paths,
  // recomputed on each call: in the order the name reads, audio markers
  // last.
  repeated RuleHit rules = 10;
}

// RuleHit is a rule and the fragment that made it fire.
message RuleHit {
  // The feature recognised: "kind.series", "kind.movie", "year", "season",
  // "episode", "quality." and the resolution ("2160p", "1080p", "720p",
  // "sd"), or "audio." and the language tag.
  string rule = 1;
  // The fragment of the name, or for audio of a name or file path, as
  // written there.
  string match = 2;
}

// PeerCounts are distinct peers over three sliding windows ending now.
message PeerCounts {
  int64 day = 1;
  int64 week = 2;
  int64 month = 3;
}

// Window is a sliding period ending now.
enum Window {
  // WINDOW_WEEK.
  WINDOW_UNSPECIFIED = 0;
  // The last 24 hours, by the hour.
  WINDOW_DAY = 1;
  // The last 7 days, by the hour.
  WINDOW_WEEK = 2;
  // The last 30 days: the last 8 days by the hour, the rest by the day.
  WINDOW_MONTH = 3;
}

// Voice narrows a work's releases by their audio in one language; without
// the language among the server's every narrowing admits no release.
enum Voice {
  // Every release.
  VOICE_UNSPECIFIED = 0;
  // Releases with a marker of the language, and those whose probability of
  // an audio track in it is known and at least 0.5.
  VOICE_LIKELY = 1;
  // Releases with a marker of the language.
  VOICE_MARKER = 2;
}

message HomeRequest {}

message HomeResponse {
  // Stored releases.
  int64 total = 1;
  // Releases first seen in the last 24 hours.
  int64 new_day = 2;
  // Releases awaiting the background classifier.
  int64 pending = 3;
}

message TopRequest {
  // KIND_MOVIE or KIND_SERIES; required.
  Kind kind = 1;
  Window window = 2;
  Voice voice = 3;
  // Entries to skip.
  int32 offset = 4;
  // At most this many entries: 20 when unset, never more than 100.
  int32 limit = 5;
  // The language of TMDBWork texts, "ru" or "en"; "en" when empty.
  string lang = 6;
  // The audio language, a BCP-47 tag, voice applies to; the server's first
  // when empty.
  string voice_language = 7;
}

message TopResponse {
  repeated TopEntry entries = 1;
  // Entries in the top in all, at most 100.
  int64 total = 2;
  // When the top was computed; absent while it never was.
  google.protobuf.Timestamp computed_at = 3;
}

// TopEntry is one work of a top, over the releases the voice admits.
message TopEntry {
  // The work's place, 1 first.
  int32 rank = 1;
  reserved 2;
  // Distinct peers of the releases the voice admits over the window.
  int64 peers = 3;
  // Change of peers against the window of the same length before it, as a
  // fraction of the earlier count: 0.5 is half as many more; absent when the
  // work had no peers then.
  optional float delta = 4;
  // The work; releases counts those the voice admits.
  WorkSummary work = 5;
  // One entry per audio language the server is configured with, in its
  // order.
  repeated WorkAudio audio = 6;
  // The sources of the releases, each once, in enum order; a release
  // without a source adds none.
  repeated VideoSource sources = 7;
  // The first sighting of the earliest release.
  google.protobuf.Timestamp first_seen = 8;
}

message StatsRequest {
  // How many 24-hour periods before now to count first sightings in, at
  // most 3660.
  int32 days = 1;
}

message StatsResponse {
  // Stored releases.
  int64 total = 1;
  // Stored releases by kind, KIND_UNSPECIFIED for unknown, with music,
  // books and software counted as KIND_OTHER; by the layer that decided the
  // kind, LAYER_UNSPECIFIED for none; and by source,
  // VIDEO_SOURCE_UNSPECIFIED for none. A value with no releases is absent.
  repeated KindCount kinds = 2;
  repeated LayerCount layers = 3;
  repeated SourceCount sources = 4;
  // At most one entry per audio language the server is configured with; a
  // language no release has an entry for is absent.
  repeated AudioCounts audio = 5;
  // Rejected infohashes by reason.
  repeated RejectionCount rejected = 6;
  // Releases awaiting the background classifier.
  int64 pending = 7;
  // Releases first seen in each of the days asked for, the latest first.
  repeated int64 days = 8;
  // Classifier tokens spent on the current UTC day, and the day's limit, 0
  // for none.
  int64 tokens_used_day = 9;
  int64 tokens_limit_day = 10;
}

message KindCount {
  Kind kind = 1;
  int64 count = 2;
}

message LayerCount {
  Layer layer = 1;
  int64 count = 2;
}

message SourceCount {
  VideoSource source = 1;
  int64 count = 2;
}

// AudioCounts are the stored releases with a marker of the language, and
// those without one whose probability of an audio track in it is at least
// 0.5 or below it.
message AudioCounts {
  string language = 1;
  int64 marker = 2;
  int64 likely = 3;
  int64 unlikely = 4;
}

message RejectionCount {
  Rejection reason = 1;
  int64 count = 2;
}

// Rejection is why the first filter rejected a torrent.
enum Rejection {
  REJECTION_UNSPECIFIED = 0;
  REJECTION_ADULT = 1;
  REJECTION_SOFTWARE = 2;
  REJECTION_BOOK = 3;
  REJECTION_COURSE = 4;
  // Under the size limit.
  REJECTION_SMALL = 5;
  // Neither video nor audio files.
  REJECTION_NO_MEDIA = 6;
  // A letter outside the allowed scripts in the name.
  REJECTION_SCRIPT = 7;
}
