# actionlint's metadata for actions/create-github-app-token@v3 lacks the client-id
# input and requires app-id; the v3 action.yml has client-id and deprecates app-id.
paths:
  .github/workflows/**/*.yaml:
    ignore:
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
