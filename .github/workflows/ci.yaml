name: CI

# On main, ci runs only as the first job of release-cut.yaml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - name: Generated code is current
        run: go generate ./... && git diff --exit-code && test -z "$(git status --porcelain)"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Chart lints and renders
        run: |
          for f in charts/sniffarr/ci/*.yaml; do
            helm lint --strict charts/sniffarr -f "$f"
            helm template sniffarr charts/sniffarr -f "$f" > /dev/null
          done

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: mikluko/action-changelog@v1

  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes --package renovate@44.171.2 -- renovate-config-validator --strict --no-global .github/renovate.json
