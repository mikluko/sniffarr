{{- if and .Values.sniff.enabled (not .Values.single.enabled) }}
{{- $v := .Values.sniff }}
{{- if not (or $v.discover $v.fetch) }}
{{- fail "sniff.discover and sniff.fetch are both false: the sniff pod would have nothing to do" }}
{{- end }}
{{- include "sniffarr.dht" (dict "root" . "component" "sniff" "v" $v "sniff" $v.discover "fetch" $v.fetch "url" $v.url "existingSecret" $v.existingSecret "secretKey" $v.secretKey "secretRequired" "sniff.existingSecret or api.existingSecret is required") }}
{{- end }}
