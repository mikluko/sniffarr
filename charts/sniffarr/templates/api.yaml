{{- $v := .Values.api }}
{{- $p := $v.persistence }}
{{- $ls := $v.litestream }}
{{- $name := printf "%s-api" .Release.Name }}
{{- /* A claim the chart made before the API was a StatefulSet stays its volume; a new install gets a claim from the StatefulSet's template. */}}
{{- $legacy := dict }}
{{- if and (eq $p.type "pvc") (not $p.existingClaim) }}
{{- $legacy = lookup "v1" "PersistentVolumeClaim" .Release.Namespace $name }}
{{- end }}
{{- $tmpl := and (eq $p.type "pvc") (not $p.existingClaim) (not $legacy) }}
{{- if hasKey $v "ui" }}
{{- fail "api.ui is not a value: the UI is the ui component, ui.enabled, with ui.addr and ui.service.targetPort in place of api.ui.addr and api.ui.targetPort" }}
{{- end }}
{{- range $c := list "ui" "sniff" "fetch" }}
{{- range $k := list "existingSecret" "secretKey" }}
{{- if hasKey (index $.Values $c) $k }}
{{- fail (printf "%s.%s is not a value: the API takes no token, and api.networkPolicy closes it instead" $c $k) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not .Values.single.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sniffarr.podSecurityContext" . | nindent 8 }}
      {{- if $ls.enabled }}
      initContainers:
        {{- include "sniffarr.litestreamInitContainers" (dict "root" . "litestream" $ls) | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "sniffarr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/sniffarr]
          args:
            - "-api"
            {{- if .Values.probe.enabled }}
            - "-probe"
            {{- end }}
          env:
            - name: SNIFFARR_DB
              value: /data/sniffarr.db
            {{- with include "sniffarr.env" (dict "root" . "env" $v.env) | trim }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with include "sniffarr.natsEnv" . | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- with $v.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if $v.nats.enabled }}
            - name: nats
              containerPort: 4222
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "sniffarr.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- with $v.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "sniffarr.dataVolumes" (dict "root" . "claim" $name "template" $tmpl) | trim | nindent 8 }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $tmpl }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $p.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $p.size }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    {{- if $v.nats.enabled }}
    - name: nats
      port: 4222
      targetPort: nats
    {{- end }}
{{- if $v.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Chart.Name }}
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with $v.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 1
          endPort: 8079
        - protocol: TCP
          port: 8081
          endPort: 65535
        - protocol: UDP
{{- end }}
{{- if and (eq $p.type "pvc") (not $p.existingClaim) (or .Values.single.enabled $legacy) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
