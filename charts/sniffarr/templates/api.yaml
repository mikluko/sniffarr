{{- $v := .Values.api }}
{{- $p := $v.persistence }}
{{- $ls := $v.litestream }}
{{- $name := printf "%s-api" .Release.Name }}
{{- if hasKey $v "ui" }}
{{- fail "api.ui is not a value: the UI is the ui component, ui.enabled, with ui.addr and ui.service.targetPort in place of api.ui.addr and api.ui.targetPort" }}
{{- end }}
{{- if not .Values.single.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "sniffarr.podSecurityContext" . | nindent 8 }}
      {{- if $ls.enabled }}
      initContainers:
        {{- include "sniffarr.litestreamInitContainers" (dict "root" . "litestream" $ls) | trim | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "sniffarr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/sniffarr]
          args:
            - "-api"
          env:
            - name: SNIFFARR_DB
              value: /data/sniffarr.db
            {{- with include "sniffarr.env" (dict "root" . "env" $v.env) | trim }}
            {{- . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "api.existingSecret is required" $v.existingSecret }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          {{- with $v.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "sniffarr.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- with $v.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "sniffarr.dataVolumes" (dict "root" . "claim" $name) | trim | nindent 8 }}
        {{- with $v.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "sniffarr.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if and (eq $p.type "pvc") (not $p.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "sniffarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
