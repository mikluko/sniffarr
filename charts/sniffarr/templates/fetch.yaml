{{- if .Values.fetch.enabled }}
{{- $v := .Values.fetch }}
{{- $d := .Values.sniff }}
{{- include "sniffarr.sniffdht" (dict "root" . "component" "fetch" "v" $v "discover" false "fetch" true "url" ($v.url | default $d.url) "existingSecret" ($v.existingSecret | default $d.existingSecret) "secretKey" ($v.secretKey | default $d.secretKey) "secretRequired" "fetch.existingSecret, sniff.existingSecret or api.existingSecret is required") }}
{{- end }}
