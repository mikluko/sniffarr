image:
  # Image of the sniffarr binary.
  repository: sarak.sh/mikluko/sniffarr
  # Image tag; the chart's appVersion when empty.
  tag: ""
  # Pull policy of the image.
  pullPolicy: IfNotPresent

# Image pull secrets of every pod.
imagePullSecrets: []

telemetry:
  # When false, every sniffarr container gets OTEL_SDK_DISABLED=true; when true, the chart sets no OTEL_* variable.
  enabled: false

waitForAPI:
  # Gives the ui, sniff, fetch and probe pods an init container wait-api, sniffarr -wait-api, which holds the pod until its SNIFFARR_URL answers with this release's version.
  enabled: true
  # Resources of the wait-api init containers.
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

api:
  # Secret the container takes its environment from, such as SNIFFARR_CLASSIFY_API_KEY; none when empty.
  existingSecret: ""
  networkPolicy:
    # Renders a NetworkPolicy admitting to the API port, 8080, only the release's own pods and from; the pod's other ports stay open.
    enabled: true
    # NetworkPolicyPeers also admitted to the API port, such as the namespaces of Prowlarr, Radarr and Sonarr.
    from: []
  # Extra environment variables, name to value.
  env: {}
  persistence:
    # Volume of /data: emptyDir, hostPath or pvc.
    type: emptyDir
    hostPath:
      # Host directory mounted at /data when type is hostPath.
      path: ""
    # Claim mounted at /data when type is pvc; the chart creates one when empty.
    existingClaim: ""
    # Size of the claim the chart creates.
    size: 10Gi
    # Storage class of the claim the chart creates; the cluster default when empty.
    storageClass: ""
  litestream:
    # Restores /data/sniffarr.db from its replica before start and replicates it while running.
    enabled: false
    image:
      # Image of the litestream containers.
      repository: litestream/litestream
      # Tag of the litestream image.
      tag: "0.5.17"
      # Pull policy of the litestream image.
      pullPolicy: IfNotPresent
    # ConfigMap whose key litestream.yml is mounted at /etc/litestream.yml; required when enabled.
    existingConfigMap: ""
    # Secret the litestream containers take their environment from, such as replica credentials.
    existingSecret: ""
    # Resources of the litestream containers.
    resources: {}
  # Containers added to the api pod, rendered as given.
  extraContainers: []
  # Volumes added to the api pod, rendered as given.
  extraVolumes: []
  # Resources of the api container.
  resources: {}
  # Annotations of the api pod.
  podAnnotations: {}
  # Labels of the api pod.
  podLabels: {}
  # Node selector of the api pod.
  nodeSelector: {}
  # Tolerations of the api pod.
  tolerations: []
  # Affinity of the api pod.
  affinity: {}

ui:
  # Deploys <release>-ui, sniffarr -ui, behind the Service <release>-ui.
  enabled: false
  # Replicas of <release>-ui.
  replicas: 1
  # SNIFFARR_URL; the release's api Service when empty.
  url: ""
  # SNIFFARR_UI_ADDR; the container port ui is declared unless it is a loopback address.
  addr: ":8081"
  service:
    # Port of the Service.
    port: 8081
    # Target of the Service port: ui, or, with a loopback addr, the port of an authenticating proxy in extraContainers.
    targetPort: ui
    # Annotations of the Service.
    annotations: {}
  # Extra environment variables, name to value: SNIFFARR_OIDC_ISSUER, SNIFFARR_SEERR_URL,
  # SNIFFARR_RADARR_URL, SNIFFARR_SONARR_URL.
  env: {}
  # Containers added to the ui pod, rendered as given.
  extraContainers: []
  # Volumes added to the ui pod, rendered as given.
  extraVolumes: []
  # Resources of the ui container.
  resources: {}
  # Annotations of the ui pod.
  podAnnotations: {}
  # Labels of the ui pod.
  podLabels: {}
  # Node selector of the ui pod.
  nodeSelector: {}
  # Tolerations of the ui pod.
  tolerations: []
  # Affinity of the ui pod.
  affinity: {}

single:
  # Runs every enabled component in one Deployment, <release>, in place of the component Deployments: -api, and -ui, -sniff and -fetch for each of ui, sniff and fetch with enabled true.
  enabled: false
  # Replicas of <release>; only 1, the process owns the SQLite database.
  replicas: 1
  # Resources of the sniffarr container.
  resources: {}
  # Annotations of the pod.
  podAnnotations: {}
  # Labels of the pod.
  podLabels: {}
  # Node selector of the pod.
  nodeSelector: {}
  # Tolerations of the pod.
  tolerations: []
  # Affinity of the pod.
  affinity: {}

sniff:
  # Deploys <release>-sniff, sniffarr -sniff.
  enabled: true
  # Rendered as -sniff; the node needs a reachable port to receive announce_peer.
  discover: true
  # Rendered as -fetch; true runs the discoverer and a fetcher in one pod.
  fetch: false
  # Replicas of <release>-sniff.
  replicas: 1
  # Runs the pod in the host's network namespace; the strategy is Recreate when true.
  hostNetwork: true
  # SNIFFARR_URL; the release's api Service when empty.
  url: ""
  # Command-line flags, name to value, rendered as -name=value after the component flags.
  flags: {}
  # Rendered as -upnp: the node asks the gateways on its network to forward its port, TCP and UDP.
  upnp: false
  service:
    # Exposes the DHT port, TCP and UDP, as <release>-sniff; needs a fixed port, not flags.port 0.
    enabled: false
    # ClusterIP, NodePort or LoadBalancer.
    type: NodePort
    # Node port of both entries, allocated by the cluster when 0; when set, the pod listens on it, so flags.port must be unset or equal.
    nodePort: 0
    # Annotations of the Service.
    annotations: {}
  # Extra environment variables, name to value.
  env: {}
  # Resources of the sniff container.
  resources: {}
  # Annotations of the sniff pod.
  podAnnotations: {}
  # Labels of the sniff pod.
  podLabels: {}
  # Node selector of the sniff pod.
  nodeSelector: {}
  # Tolerations of the sniff pod.
  tolerations: []
  # Affinity of the sniff pod.
  affinity: {}

fetch:
  # Deploys <release>-fetch, sniffarr -fetch.
  enabled: true
  # Replicas of <release>-fetch.
  replicas: 1
  # Runs the pod in the host's network namespace; the strategy is Recreate when true.
  hostNetwork: false
  # SNIFFARR_URL; sniff.url when empty.
  url: ""
  # Command-line flags, name to value, rendered as -name=value after the component flags.
  flags: {}
  # Rendered as -upnp: the node asks the gateways on its network to forward its port, TCP and UDP.
  upnp: false
  service:
    # Exposes the DHT port, TCP and UDP, as <release>-fetch; needs a fixed port, not flags.port 0.
    enabled: false
    # ClusterIP, NodePort or LoadBalancer.
    type: NodePort
    # Node port of both entries, allocated by the cluster when 0; when set, the pod listens on it, so flags.port must be unset or equal.
    nodePort: 0
    # Annotations of the Service.
    annotations: {}
  # Extra environment variables, name to value.
  env: {}
  # Resources of the fetch container.
  resources: {}
  # Annotations of the fetch pod.
  podAnnotations: {}
  # Labels of the fetch pod.
  podLabels: {}
  # Node selector of the fetch pod.
  nodeSelector: {}
  # Tolerations of the fetch pod.
  tolerations: []
  # Affinity of the fetch pod.
  affinity: {}

probe:
  # Renders -probe on the API and deploys <release>-probe, a StatefulSet of sniffarr -fetch -probe -probe-dir=/seeds: fetchers that take probe tasks too, reading the tracks of stored releases from the first pieces of their main video file and seeding those pieces, kept in /seeds.
  enabled: false
  # Replicas of <release>-probe, each with a /seeds of its own.
  replicas: 1
  # Runs the pods in the host's network namespace.
  hostNetwork: false
  # SNIFFARR_URL; fetch.url, then sniff.url, when empty.
  url: ""
  # Command-line flags, name to value, rendered as -name=value after the component flags.
  flags: {}
  # Rendered as -upnp: the node asks the gateways on its network to forward its port, TCP and UDP.
  upnp: false
  service:
    # Exposes the DHT port, TCP and UDP, as <release>-probe; needs a fixed port, not flags.port 0.
    enabled: false
    # ClusterIP, NodePort or LoadBalancer.
    type: NodePort
    # Node port of both entries, allocated by the cluster when 0; when set, the pod listens on it, so flags.port must be unset or equal.
    nodePort: 0
    # Annotations of the Service.
    annotations: {}
  # Probes at once, rendered as -probers.
  probers: 4
  # How long one probe may take, rendered as -probe-timeout.
  timeout: 10m
  # Piece data kept for seeding, the oldest torrents removed first beyond it, rendered as -seed-max-size; keep it below the volume's size.
  maxSize: 200GiB
  # How long a probed torrent is seeded at most, rendered as -seed-max-age.
  maxAge: 168h
  persistence:
    # Volume of /seeds: emptyDir, hostPath or pvc, a claim per replica, seeds-<release>-probe-<n>; in single mode the claim is <release>-seeds.
    type: emptyDir
    hostPath:
      # Host directory under which each pod has its /seeds, <path>/<pod>, when type is hostPath; the kubelet makes a missing one root's, see extraInitContainers.
      path: ""
    # Size of each claim.
    size: 250Gi
    # Storage class of the claims; the cluster default when empty.
    storageClass: ""
  # Extra environment variables, name to value.
  env: {}
  # Init containers of the probe pods, as written; the volume seeds is the whole hostPath, where one may make <path>/<pod> the pod's, UID 65532.
  extraInitContainers: []
  # Resources of the probe container.
  resources: {}
  # Annotations of the probe pods.
  podAnnotations: {}
  # Labels of the probe pods.
  podLabels: {}
  # Node selector of the probe pods.
  nodeSelector: {}
  # Tolerations of the probe pods.
  tolerations: []
  # Affinity of the probe pods.
  affinity: {}
