probe:
  enabled: true
  replicas: 2
  persistence:
    type: hostPath
    hostPath:
      path: /srv/sniffarr-seeds
  extraInitContainers:
    - name: seeds-owner
      image: busybox:1.37
      command: [sh, -c, 'mkdir -p "/seeds/$POD_NAME" && chown 65532:65532 "/seeds/$POD_NAME"']
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      volumeMounts:
        - name: seeds
          mountPath: /seeds
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN, DAC_OVERRIDE, FOWNER]
