sniffapi:
  existingSecret: sniffarr-tokens
  env:
    SNIFFARR_CLASSIFY_SEARCH_RESERVE: 40
    SNIFFARR_SCRIPTS: Latin,Cyrillic,Greek
  persistence:
    type: hostPath
    hostPath:
      path: /srv/sniffarr
  litestream:
    enabled: true
    existingConfigMap: sniffarr-litestream
    existingSecret: sniffarr-litestream
  nodeSelector:
    kubernetes.io/os: linux

telemetry:
  enabled: true

sniffdht:
  hostNetwork: true
  flags:
    port: 51000
    fetchers: 500
    rate: 1000
  env:
    OTEL_SERVICE_NAME: sniffdht

snifffetch:
  replicas: 3
  flags:
    fetchers: 1000
    min-peers: 2
  env:
    OTEL_SERVICE_NAME: snifffetch
  nodeSelector:
    kubernetes.io/os: linux
