api:
  existingSecret: sniffarr-tokens
  env:
    SNIFFARR_CLASSIFY_SEARCH_RESERVE: 40
    SNIFFARR_SCRIPTS: Latin,Cyrillic,Greek
  persistence:
    type: hostPath
    hostPath:
      path: /srv/sniffarr
  litestream:
    enabled: true
    existingConfigMap: sniffarr-litestream
    existingSecret: sniffarr-litestream
  nodeSelector:
    kubernetes.io/os: linux
  ui:
    enabled: true
    targetPort: proxy
  extraContainers:
    - name: oauth2-proxy
      image: quay.io/oauth2-proxy/oauth2-proxy
      args:
        - --http-address=0.0.0.0:4180
        - --upstream=http://127.0.0.1:8081
        - --pass-access-token=true
      envFrom:
        - secretRef:
            name: sniffarr-oauth2-proxy
      ports:
        - name: proxy
          containerPort: 4180
      volumeMounts:
        - name: proxy-templates
          mountPath: /templates
  extraVolumes:
    - name: proxy-templates
      emptyDir: {}

telemetry:
  enabled: true

sniff:
  hostNetwork: true
  flags:
    port: 51000
    fetchers: 500
    rate: 1000
  env:
    OTEL_SERVICE_NAME: sniff

fetch:
  replicas: 3
  flags:
    fetchers: 1000
    min-peers: 2
  env:
    OTEL_SERVICE_NAME: fetch
  nodeSelector:
    kubernetes.io/os: linux
