name: Roll release
run-name: ${{ github.event_name == 'push' && format('Releasing {0}', github.ref_name) || format('Dry run of a release from {0}', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-roll
  cancel-in-progress: false

# The automatic token cannot write packages owned by a user, so registry access
# trades an OIDC token for an Authorized Integration of the owner's, selected
# by REGISTRY_AUDIENCE and scoped write:package.
enable-openid-connect: true

env:
  REGISTRY: sarak.sh
  REGISTRY_AUDIENCE: u:1:62e83a47-a7dc-4f1e-9075-57e5a37b8449
  IMAGE: sarak.sh/mikluko/sniffarr
  CHART_REPOSITORY: oci://sarak.sh/mikluko/charts
  DEBIAN_DISTRIBUTION: trixie
  DEBIAN_COMPONENT: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.version.outputs.due }}
      version: ${{ steps.version.outputs.version }}
      tag: v${{ steps.version.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changelog
        uses: https://forge.sarak.sh/actions/changelog@v1
        with:
          due-prerelease: true
      - id: version
        name: Version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          NEWEST: ${{ steps.changelog.outputs.version }}
          DUE: ${{ steps.changelog.outputs.due }}
          DUE_REASON: ${{ steps.changelog.outputs['due-reason'] }}
        run: |
          due=$DUE
          reason=$DUE_REASON
          version=$NEWEST
          publish=false
          if [ "$EVENT" = push ]; then
            version=${REF_NAME#v}
            if [ -z "$NEWEST" ] || [ "$REF_NAME" != "v$NEWEST" ]; then
              echo "::error::tag $REF_NAME is not the newest version CHANGELOG.md names, ${NEWEST:-which is none}"
              exit 1
            fi
            due=true
            publish=true
            reason="$REF_NAME is the newest version CHANGELOG.md names"
          fi
          echo "::notice::${reason:-$version is due}"
          {
            echo "due=$due"
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  image:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in
        if: needs.plan.outputs.publish == 'true'
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | docker login "$REGISTRY" --username oidc --password-stdin
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          push=
          if [ "$PUBLISH" = true ]; then push=--push; fi
          docker buildx build $push \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            .

  chart:
    needs: [plan, image]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/sniffarr \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - name: Push
        if: needs.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | helm registry login "$REGISTRY" --username oidc --password-stdin
          helm push "$RUNNER_TEMP/chart/sniffarr-$VERSION.tgz" "$CHART_REPOSITORY"

  # Static binaries for amd64 and arm64: an archive with the systemd unit and
  # the settings file each, their checksums, and a .deb each for the owner's
  # Debian registry.
  packages:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          for GOARCH in amd64 arm64; do
            export GOARCH
            CGO_ENABLED=0 GOOS=linux go build -trimpath -ldflags=-s -o dist/sniffarr .
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target dist/
            tar -czf "dist/sniffarr_${VERSION}_linux_${GOARCH}.tar.gz" -C dist sniffarr \
              -C ../packaging sniffarr.service sniffarr.default
            rm dist/sniffarr
          done
          (cd dist && sha256sum ./*.tar.gz ./*.deb >checksums.txt && cat checksums.txt)
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
      - name: Upload to the Debian registry
        if: needs.plan.outputs.publish == 'true'
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$REGISTRY_AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          owner=${GITHUB_REPOSITORY%%/*}
          for deb in dist/*.deb; do
            curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $jwt" --upload-file "$deb" \
              "$GITHUB_SERVER_URL/api/packages/$owner/debian/pool/$DEBIAN_DISTRIBUTION/$DEBIAN_COMPONENT/upload"
          done

  # Last, so a release exists only once every artifact it names does.
  release:
    needs: [plan, image, chart, packages]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Notes
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"
          echo "release $TAG from $GITHUB_SHA:"
          cat "$RUNNER_TEMP/notes.md"
      - name: Release
        if: needs.plan.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          id=$(jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notes.md" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, name: $tag, body: $body, prerelease: $pre}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$api/releases" | jq -r .id)
          for asset in dist/*; do
            curl --fail-with-body -sS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$asset" "$api/releases/$id/assets?name=$(basename "$asset")" >/dev/null
          done
