name: CI

# On main, ci runs only as the first job of release-cut.yaml.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: https://github.com/bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true
      - run: buf lint
      - name: Generated code is current
        run: go generate ./... && git diff --exit-code && test -z "$(git status --porcelain)"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Chart lints and renders
        run: |
          for f in charts/sniffarr/ci/*.yaml; do
            helm lint --strict charts/sniffarr -f "$f"
            helm template sniffarr charts/sniffarr -f "$f" > /dev/null
          done

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: https://forge.sarak.sh/actions/changelog@v1
