name: Release
run-name: Checking changelog for a due release

# A push to main whose newest CHANGELOG.md entry names a version no tag
# carries releases it once CI passes. A draft release holds the version and
# the notes while build.yaml builds and publishes the artifacts; publishing
# the draft last creates the tag, so a tag and a visible release exist only
# once every artifact they name does.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yaml

  # A draft makes no tag, so a run that failed leaves the version due; the
  # next run replaces the draft it left.
  draft:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changelog
        uses: https://sarak.sh/actions/changelog@v1
        with:
          due-prerelease: true
      - name: Nothing due
        if: steps.changelog.outputs.due != 'true'
        env:
          DUE_REASON: ${{ steps.changelog.outputs['due-reason'] }}
        run: echo "::notice::${DUE_REASON:-nothing is due}"
      - id: draft
        name: Draft
        if: steps.changelog.outputs.due == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.changelog.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.notes }}
          PRERELEASE: ${{ steps.changelog.outputs.prerelease }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          curl --fail-with-body -sS -H "$auth" "$api/releases?draft=true&limit=50" |
            jq -r --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag) | .id' |
            while read -r old; do
              curl --fail-with-body -sS -X DELETE -H "$auth" "$api/releases/$old"
            done
          id=$(jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg body "$NOTES" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, prerelease: $pre, draft: true}' |
            curl --fail-with-body -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d @- "$api/releases" | jq -r .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"

  build:
    needs: draft
    if: needs.draft.outputs.due == 'true'
    uses: ./.forgejo/workflows/build.yaml
    with:
      version: ${{ needs.draft.outputs.version }}
      publish: true
      release-id: ${{ needs.draft.outputs.id }}

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.draft.outputs.id }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          curl --fail-with-body -sS -o /dev/null -X PATCH \
            -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d '{"draft": false}' "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/$ID"
          echo "Released **v$VERSION** from $GITHUB_SHA." >>"$GITHUB_STEP_SUMMARY"
