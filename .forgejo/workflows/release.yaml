name: Release
run-name: ${{ github.event_name == 'push' && 'Checking changelog for a due release' || format('Dry run of a release from {0}', github.ref_name) }}

# A push to main whose newest CHANGELOG.md entry names a version no tag
# carries releases it: the image, the chart, the archives and the .deb
# packages, then the Forgejo release, whose tag is born with it. Run by
# hand, the workflow builds the newest version and publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# The automatic token cannot write packages owned by a user, so registry access
# trades an OIDC token for an Authorized Integration of the owner's, selected
# by vars.REGISTRY_AUDIENCE and scoped write:package.
enable-openid-connect: true

env:
  REGISTRY: sarak.sh
  IMAGE: sarak.sh/mikluko/sniffarr
  CHART_REPOSITORY: oci://sarak.sh/mikluko/charts
  DEBIAN_DISTRIBUTION: trixie
  DEBIAN_COMPONENT: main

jobs:
  ci:
    uses: ./.forgejo/workflows/ci.yaml

  plan:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.changelog.outputs.due }}
      version: ${{ steps.changelog.outputs.version }}
      tag: v${{ steps.changelog.outputs.version }}
      prerelease: ${{ steps.changelog.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
      publish: ${{ github.event_name == 'push' && steps.changelog.outputs.due == 'true' }}
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changelog
        uses: https://sarak.sh/actions/changelog@v1
        with:
          due-prerelease: true
      - name: Plan
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.changelog.outputs.version }}
          DUE: ${{ steps.changelog.outputs.due }}
          DUE_REASON: ${{ steps.changelog.outputs['due-reason'] }}
        run: |
          if [ "$EVENT" != push ]; then
            echo "::notice::dry run of ${VERSION:-no version}: nothing is published"
          elif [ "$DUE" = true ]; then
            echo "::notice::$VERSION is due"
          else
            echo "::notice::${DUE_REASON:-nothing is due}"
          fi

  image:
    needs: plan
    if: needs.plan.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - name: Log in
        if: needs.plan.outputs.publish == 'true'
        env:
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | docker login "$REGISTRY" --username oidc --password-stdin
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          push=
          if [ "$PUBLISH" = true ]; then push=--push; fi
          docker buildx build $push \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "COMMIT=$GITHUB_SHA" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            .

  chart:
    needs: [plan, image]
    if: needs.plan.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/azure/setup-helm@v5
        with:
          version: v4.3.1
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          helm package charts/sniffarr \
            --version "$VERSION" --app-version "$VERSION" \
            --destination "$RUNNER_TEMP/chart"
      - name: Push
        if: needs.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          printf '%s' "$jwt" | helm registry login "$REGISTRY" --username oidc --password-stdin
          helm push "$RUNNER_TEMP/chart/sniffarr-$VERSION.tgz" "$CHART_REPOSITORY"

  # Static binaries for amd64 and arm64: an archive with the systemd unit and
  # the settings file each, their checksums, and a .deb each for the owner's
  # Debian registry.
  packages:
    needs: plan
    if: needs.plan.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7
        with:
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@v7
        with:
          go-version-file: go.mod
          # GitHub release downloads, the default, fail from the runners with 5xx.
          go-download-base-url: https://go.dev/dl
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          pkg=sarak.sh/mikluko/sniffarr/internal/version
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for GOARCH in amd64 arm64; do
            export GOARCH
            CGO_ENABLED=0 GOOS=linux go build -trimpath -o dist/sniffarr \
              -ldflags "-s -X $pkg.version=$VERSION -X $pkg.commit=$GITHUB_SHA -X $pkg.built=$built" .
            "$(go env GOPATH)/bin/nfpm" package --config packaging/nfpm.yaml --packager deb --target dist/
            tar -czf "dist/sniffarr_${VERSION}_linux_${GOARCH}.tar.gz" -C dist sniffarr \
              -C ../packaging sniffarr.service sniffarr.default
            rm dist/sniffarr
          done
          (cd dist && sha256sum ./*.tar.gz ./*.deb >checksums.txt && cat checksums.txt)
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/checksums.txt
      - name: Upload to the Debian registry
        if: needs.plan.outputs.publish == 'true'
        env:
          AUDIENCE: ${{ vars.REGISTRY_AUDIENCE }}
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$jwt"
          owner=${GITHUB_REPOSITORY%%/*}
          for deb in dist/*.deb; do
            curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $jwt" --upload-file "$deb" \
              "$GITHUB_SERVER_URL/api/packages/$owner/debian/pool/$DEBIAN_DISTRIBUTION/$DEBIAN_COMPONENT/upload"
          done

  # Last, so the tag and the release exist only once every artifact they
  # name does. The release API makes the tag; nothing is pushed.
  release:
    needs: [plan, image, chart, packages]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          NOTES: ${{ needs.plan.outputs.notes }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          id=$(jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg body "$NOTES" --argjson pre "$PRERELEASE" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, prerelease: $pre}' |
            curl --fail-with-body -sS -X POST \
              -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d @- "$api/releases" | jq -r .id)
          for asset in dist/*; do
            curl --fail-with-body -sS -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$asset" "$api/releases/$id/assets?name=$(basename "$asset")" >/dev/null
          done
          echo "Released **$TAG** from $GITHUB_SHA." >>"$GITHUB_STEP_SUMMARY"
